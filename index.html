<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070816">
  <meta name="description" content="Pocket Arcade — five complete browser arcade games in one pocket-sized site. Plays on desktop and mobile.">
  <title>Pocket Arcade</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#games">Skip to games</a>
  <header class="site-head">
    <div class="wrap head-inner">
      <div class="brand">
        <h1 class="logo"><span class="logo-a">Pocket</span> <span class="logo-b">Arcade</span></h1>
        <p class="tagline">Five games. One pocket-sized arcade.</p>
      </div>
      <div class="controls" role="group" aria-label="Arcade settings">
        <button class="ctl" id="toggle-sound" type="button" aria-pressed="true"><span class="ctl-name">Sound</span><span class="ctl-state">On</span></button>
        <button class="ctl" id="toggle-motion" type="button" aria-pressed="false"><span class="ctl-name">Reduced motion</span><span class="ctl-state">Off</span></button>
        <button class="ctl ctl-danger" id="reset-data" type="button"><span class="ctl-name">Reset saved data</span></button>
      </div>
    </div>
  </header>

  <main id="games" class="wrap">
    <h2 class="sr-only">Games</h2>
    <ul class="grid" id="game-grid" aria-label="Game list"></ul>
    <noscript><p class="noscript">Pocket Arcade needs JavaScript to run. Please enable it and reload.</p></noscript>
  </main>

  <footer class="site-foot wrap">
    <p>Best times and scores are saved in this browser only. No accounts, no tracking.</p>
  </footer>

  <div class="modal" id="confirm" hidden>
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
      <h2 id="confirm-title">Reset all saved data?</h2>
      <p id="confirm-desc">This clears every high score, best time and level record. Your sound and motion settings stay.</p>
      <div class="modal-btns">
        <button class="ctl" type="button" data-no>Keep my scores</button>
        <button class="ctl ctl-danger" type="button" data-yes>Reset everything</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/arcade.js"></script>
</body>
</html>
