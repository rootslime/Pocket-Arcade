<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070816">
  <meta name="description" content="Pocket Arcade — twelve complete browser games with a console-style launcher, multiplayer rooms, accounts, achievements and cloud saves. Plays on desktop, mobile and with a controller.">
  <title>Pocket Arcade</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="console">
  <a class="skip" href="#view">Skip to content</a>
  <div class="bg" aria-hidden="true">
    <div class="bg-layer on"></div><div class="bg-layer"></div><div class="bg-grid"></div><div id="bg-particles"></div>
  </div>

  <header class="nav">
    <a class="logo" href="#/home" aria-label="Pocket Arcade home"><span class="logo-a">Pocket</span> <span class="logo-b">Arcade</span></a>
    <nav class="nav-tabs" aria-label="Main">
      <button type="button" class="nav-tab" data-route="home">Home</button>
      <button type="button" class="nav-tab" data-route="library">Library</button>
      <button type="button" class="nav-tab" data-route="multiplayer">Multiplayer</button>
      <button type="button" class="nav-tab" data-route="achievements">Achievements</button>
      <button type="button" class="nav-tab" data-route="profile">Profile</button>
      <button type="button" class="nav-tab" data-route="settings">Settings</button>
    </nav>
    <div class="nav-right"><span id="pad-indicator" class="pad-ind" hidden title="Controller connected" aria-label="Controller connected">🎮</span><div class="nav-account" id="nav-account"></div></div>
  </header>

  <main id="view" tabindex="-1" aria-live="off"><noscript><p class="noscript">Pocket Arcade needs JavaScript to run. Please enable it and reload.</p></noscript></main>

  <footer class="foot"><p>Twelve games · No ads · Guests play free — accounts only add cloud saves. <span class="muted">Arrow keys / D-pad to navigate · Enter / A to select · Esc / B to go back</span></p></footer>

  <script type="module" src="js/arcade.js"></script>
</body>
</html>
